<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube UI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  color: #222;
  background: white;
}


header {
  height: 60px;
  border-bottom: 1px solid #ddd;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 25px;

  position: sticky;
  top: 0;
  background: white;
  z-index: 10;
}

.logo {
  font-size: 20px;
  display: flex;
  gap: 20px;
  align-items: center;
}

.logo span {
  color: red;
  font-weight: bold;
}

.search {
  display: flex;
  width: 45%;
}

.search input {
  width: 100%;
  height: 38px;
  border: 1px solid #ccc;
  padding: 10px;
  font-size: 15px;
}

.search button {
  width: 60px;
  border: 1px solid #ccc;
  background: #f8f8f8;
}

.icons {
  font-size: 18px;
}


aside {
  position: fixed;
  top: 60px;
  left: 0;

  width: 220px;
  height: calc(100vh - 60px);

  padding: 15px;

  background: white;
  overflow-y: auto;
}

.side-item {
  padding: 13px 10px;
  margin-bottom: 3px;
  cursor: pointer;
  border-radius: 5px;
}

.side-item:hover {
  background: #eee;
}

.side-item.active {
  background: #e5e5e5;
  font-weight: bold;
}

aside hr {
  border: 0;
  border-top: 1px solid #ddd;
  margin: 15px 0;
}

aside h4 {
  font-size: 13px;
  margin: 15px 10px;
  color: #555;
}



main {
  margin-left: 220px;
  padding: 15px 25px;
}


.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 20px;
}

.categories button  {
  white-space: nowrap;
  border: 1px solid #ddd;
  background: #f5f5f5;

  padding: 8px 16px;
  border-radius: 20px;

  cursor: pointer;
}

.categories button :selected {
  background: black;
  color: white;
}

  </style>
</head>
<body>

  <header>
    <div class="logo">
      ☰ <span>▶ YouTube</span>
    </div>

    <div class="search">
      <input type="text" placeholder="Search">
      <button>🔍</button>
    </div>

    <div class="icons">
      🎥　🔔　⚪
    </div>
  </header>


  <aside>
    <div class="side-item active">🏠 Home</div>
    <div class="side-item">🧭 Explore</div>
    <div class="side-item">📺 Subscriptions</div>

    <hr>

    <div class="side-item">📚 Library</div>
    <div class="side-item">🕐 History</div>
    <div class="side-item">▶️ Your videos</div>
    <div class="side-item">⏱ Watch later</div>
    <div class="side-item">👍 Liked videos</div>

    <hr>

    <h4>SUBSCRIPTIONS</h4>
    <div class="side-item">🎵 Music</div>
    <div class="side-item">⚽ Sports</div>
    <div class="side-item">🎮 Gaming</div>
    <div class="side-item">📰 News</div>
  </aside>

  <main>

    <div class="categories">
      <button class="selected">All</button>
      <button>Zain forex</button>
      <button>Mixes</button>
      <button>Zain-dev</button>
      <button>bollywood</button>
      <button>Logos</button>
      <button>Graphic design</button>
      <button>Website</button>
      <button>Computer Science</button>
    </div>


  </main>

</body>
</html>
